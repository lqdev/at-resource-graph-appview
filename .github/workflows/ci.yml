name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository and primitives
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Authenticate GitHub Packages
        shell: bash
        run: dotnet nuget update source github --username "${GITHUB_ACTOR}" --password "${GITHUB_TOKEN}" --store-password-in-clear-text --configfile NuGet.config
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore
        run: dotnet restore AtResourceGraph.AppView.sln

      - name: Build
        run: dotnet build AtResourceGraph.AppView.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test AtResourceGraph.AppView.sln --no-build --configuration Release --no-restore
